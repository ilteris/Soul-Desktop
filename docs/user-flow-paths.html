<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soul-Desktop relationships</title>
<style>
  :root {
    --bg: #eef2f7;
    --ink: #1f2430;
    --muted: #6d7484;
    --subtle: #9098aa;
    --line: #a8b0c2;
    --line-strong: #4f8f63;
    --line-warn: #b7791f;
    --panel: #ffffff;
    --panel-2: #f7f9fc;
    --green: #dcefe3;
    --green-stroke: #62a875;
    --blue: #dfeafe;
    --blue-stroke: #6b8fd8;
    --amber: #fff1d8;
    --amber-stroke: #d59a34;
    --red: #ffe2e0;
    --red-stroke: #d36a61;
    --shadow: rgba(32, 42, 64, 0.12);
  }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  }
  header {
    padding: 22px 28px 10px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    max-width: 980px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .stage {
    padding: 14px 24px 32px;
    overflow: auto;
  }
  svg {
    width: 1540px;
    height: 980px;
    display: block;
    background: #f8fafc;
    border: 1px solid #d8deea;
    border-radius: 10px;
    box-shadow: 0 18px 40px var(--shadow);
  }
  .lane {
    fill: #f1f5fb;
    stroke: #dde4ef;
  }
  .lane-title {
    fill: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .node rect {
    fill: var(--panel);
    stroke: #c9d1df;
    stroke-width: 1;
    rx: 8;
  }
  .node.green rect { fill: var(--green); stroke: var(--green-stroke); }
  .node.blue rect { fill: var(--blue); stroke: var(--blue-stroke); }
  .node.amber rect { fill: var(--amber); stroke: var(--amber-stroke); }
  .node.red rect { fill: var(--red); stroke: var(--red-stroke); }
  .title {
    fill: var(--ink);
    font-size: 14px;
    font-weight: 700;
  }
  .body {
    fill: var(--muted);
    font-size: 11px;
  }
  .ref {
    fill: var(--subtle);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 9.5px;
  }
  .edge {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.4;
  }
  .edge.strong { stroke: var(--line-strong); stroke-width: 2; }
  .edge.warn { stroke: var(--line-warn); stroke-width: 1.8; stroke-dasharray: 6 4; }
  .edge.fail { stroke: var(--red-stroke); stroke-width: 1.6; stroke-dasharray: 4 4; }
  .edge.repair { stroke: var(--blue-stroke); stroke-width: 1.8; stroke-dasharray: 3 4; }
  .label-bg {
    fill: #ffffff;
    stroke: #d9dfeb;
    stroke-width: 0.8;
    rx: 9;
  }
  .label {
    fill: var(--ink);
    font-size: 10px;
    font-weight: 600;
  }
  .note {
    fill: #fff;
    stroke: #d8deea;
    rx: 8;
  }
</style>
</head>
<body>
<header>
  <h1>Soul-Desktop session flow relationships</h1>
  <p>
    This map shows how user actions, controllers, registry files, native agent transcripts, and render targets depend on each other.
    Green is the primary send/resume path. Blue is repair/backfill. Amber is replay/fallback. Red is a blocked or failed resume path.
  </p>
</header>

<div class="stage">

  </g>

  <!-- Agent runtime -->
  <g class="node green" transform="translate(982 92)">
    <rect width="206" height="118"/>
    <text class="title" x="16" y="26">ACP client</text>
    <text class="body" x="16" y="46">session/new</text>
    <text class="body" x="16" y="62">session/load</text>
    <text class="body" x="16" y="78">prompt</text>
    <text class="body" x="16" y="94">stream events</text>
    <text class="ref" x="16" y="110">ACPClient.swift</text>
  </g>

  <g class="node blue" transform="translate(982 260)">
    <rect width="206" height="128"/>
    <text class="title" x="16" y="26">Native transcripts</text>
    <text class="body" x="16" y="46">Gemini tmp chats</text>
    <text class="body" x="16" y="62">Codex project jsonl</text>
    <text class="body" x="16" y="78">First user message match</text>
    <text class="ref" x="16" y="100">~/.gemini/tmp/...</text>
    <text class="ref" x="16" y="116">~/.Codex/projects/...</text>
  </g>

  <g class="node red" transform="translate(982 430)">
    <rect width="206" height="94"/>
    <text class="title" x="16" y="26">Invalid native id</text>
    <text class="body" x="16" y="46">session/load fails</text>
    <text class="body" x="16" y="62">-32602 / invalid id</text>

  </g>

  <!-- Render targets -->
  <g class="node green" transform="translate(1276 92)">
    <rect width="206" height="110"/>
    <text class="title" x="16" y="26">ThreadView</text>
    <text class="body" x="16" y="46">User messages</text>
    <text class="body" x="16" y="62">Agent messages</text>

  <!-- Relationship notes -->
  <rect class="note" x="52" y="842" width="1430" height="70"/>
  <text class="title" x="72" y="868">How to read this</text>
  <text class="body" x="72" y="890">
    The same session has two identities: the registry UUID in hooks.jsonl and the provider-native UUID used by ACP/session.load.
    Resume succeeds only when the registry row can resolve to the native id. Replay bypasses the agent runtime and reads hooks only.
  </text>

</html>
